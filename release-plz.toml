[workspace]
# release-plz owns version bumping, CHANGELOG.md, and the release PR. The
# hand-maintained release-plz.yml workflow owns preflight, tagging, crates.io
# Trusted Publishing, GitHub Releases, and Homebrew promotion.
changelog_update   = true
git_tag_enable     = false            # promotion creates the validated tag
git_release_enable = false            # promotion creates and verifies the GitHub Release
git_tag_name       = "v{{ version }}"
semver_check       = false            # purr is primarily a binary; skip cargo-semver-checks noise
pr_labels          = ["release"]
